<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCare · Servicios para mascotas</title>
<style>
:root{--ink:#153e3b;--green:#176b58;--cream:#f6f5ef}*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:var(--ink);background:var(--cream)}header{padding:22px 6%;background:white;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce5dd}.logo{font-size:28px;font-weight:850}small,.muted{color:#59736c}main{max-width:1160px;margin:35px auto;padding:0 24px}h1{font-size:42px;line-height:1.1;max-width:700px;margin:15px 0}h2{font-size:25px}h3{margin-top:0}button{cursor:pointer;border:0;border-radius:9px;background:var(--green);color:white;padding:12px 18px;font:600 14px system-ui}button:hover{filter:brightness(.9)}button.secondary{background:#e3ece5;color:var(--ink)}nav{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:20px}.card{background:white;border:1px solid #dce4db;border-radius:18px;padding:25px;margin-bottom:16px}.hero{background:#dfeadd;padding:32px;border-radius:22px;margin-bottom:25px}.tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700}.badge{display:inline-block;padding:6px 10px;background:#edf2dc;border-radius:20px;font-size:13px}input,select{width:100%;padding:12px;border:1px solid #b8cbc0;border-radius:8px;font:inherit;background:white;margin:7px 0 16px}label{display:block;font-size:14px;font-weight:600}form{max-width:530px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.price{font-size:26px;font-weight:750;margin:20px 0}#message{position:sticky;top:5px;background:#163f38;color:white;padding:15px;border-radius:9px;z-index:5}footer{padding:25px 6%;font-size:13px;border-top:1px solid #dbe2d7}a{color:var(--green)}.empty{padding:35px;background:white;border-radius:15px}@media(max-width:600px){h1{font-size:32px}header{gap:15px;flex-wrap:wrap}}
</style>
<header><div class="logo">PetCare<span style="color:#7c9a5a"> ●</span></div><div id="account"></div></header><main><div id="message" role="status" hidden></div><div id="app"></div></main><footer>Prototipo académico · Datos ficticios · Almacenamiento local en este navegador · Sin pagos en línea</footer>
<script>
const KEY='petcare-v1';const cats=['Veterinaria','Peluquería','Paseo','Guardería'];
const initial={users:[{id:'p',name:'Proveedor Demo',email:'proveedor@petcare.test',password:'Demo1234',role:'proveedor'},{id:'u',name:'Propietario Demo',email:'cliente@petcare.test',password:'Demo1234',role:'propietario'}],pets:[{id:'pet',owner:'u',name:'Luna',species:'Perro'}],services:[{id:'s1',owner:'p',name:'Consulta de bienestar',category:'Veterinaria',price:65000,zone:'Zona de prueba',description:'Valoración general con cita previa.'},{id:'s2',owner:'p',name:'Baño y cuidado',category:'Peluquería',price:45000,zone:'Zona de prueba',description:'Baño, secado y cepillado para tu mascota.'}],slots:[],bookings:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(initial),user=null,page='catalog',filter='';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}save();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
function tell(s){let e=document.querySelector('#message');e.textContent=s;e.hidden=false;setTimeout(()=>e.hidden=true,6000)}
function go(p){page=p;render()}function field(name,label,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" required ${extra}></label>`}function select(name,label,options){return `<label>${label}<select name="${name}" required>${options}</select></label>`}function opt(v,t){return `<option value="${esc(v)}">${esc(t)}</option>`}
function render(){document.querySelector('#account').innerHTML=user?`${esc(user.name)} · ${esc(user.role)} <button class="secondary" onclick="user=null;go('catalog')">Salir</button>`:`<button onclick="go('login')">Ingresar</button> <button class="secondary" onclick="go('register')">Crear cuenta</button>`;let nav=`<nav><button class="secondary" onclick="go('catalog')">Explorar servicios</button>${user?`<button class="secondary" onclick="go('bookings')">${user.role==='proveedor'?'Solicitudes recibidas':'Mis reservas'}</button><button class="secondary" onclick="go('${user.role==='proveedor'?'manage':'pets'}')">${user.role==='proveedor'?'Servicios y horarios':'Mis mascotas'}</button>`:''}</nav>`;let html='';
if(page==='login'||page==='register'){let reg=page==='register';html=`<h1>${reg?'Únete a PetCare':'Qué bueno verte'}</h1><div class="card"><form id="auth">${reg?field('name','Nombre completo')+select('role','Tipo de cuenta',opt('propietario','Propietario')+opt('proveedor','Proveedor')):''}${field('email','Correo electrónico','email')}${field('password','Contraseña (mínimo 8 caracteres)','password','minlength="8"')}<button>${reg?'Crear cuenta':'Ingresar'}</button></form><p class="muted">Cuentas de prueba: cliente@petcare.test o proveedor@petcare.test<br>Contraseña: Demo1234</p><small>Acceso de demostración local. No uses contraseñas ni datos personales reales.</small></div>`}
else if(page==='catalog'){html=`<section class="hero"><span class="tag">Cuidado cercano, reservas claras</span><h1>Todo para su bienestar,<br>en un mismo lugar.</h1><p>Encuentra un servicio, elige un horario y consulta tu solicitud.</p><span class="badge">PetCare / Prototipo funcional 1.0</span></section><div class="row"><h2>Explora los servicios</h2><select aria-label="Filtrar categoría" style="width:240px;margin-left:auto" onchange="filter=this.value;render()"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${filter===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="grid">${db.services.filter(s=>!filter||s.category===filter).map(s=>`<article class="card"><span class="badge">${esc(s.category)}</span><h2>${esc(s.name)}</h2><p>${esc(s.description)}</p><small>${esc(s.zone)} · Proveedor de demostración</small><div class="price">${money(s.price)}</div><button onclick="reserve('${s.id}')">Ver horarios y reservar</button></article>`).join('')||'<p>No hay servicios en esta categoría.</p>'}</div>`}
else if(!user){page='login';return render()}
else if(page==='pets'){html=`<h1>Mis mascotas</h1><div class="grid"><div class="card"><h2>Registrar mascota</h2><form id="petform">${field('name','Nombre')}${select('species','Especie',opt('Perro','Perro')+opt('Gato','Gato')+opt('Otra','Otra'))}<button>Guardar mascota</button></form></div><div>${db.pets.filter(p=>p.owner===user.id).map(p=>`<div class="card"><h2>${esc(p.name)}</h2><p>${esc(p.species)}</p></div>`).join('')||'<p>Aún no has registrado mascotas.</p>'}</div></div>`}
else if(page==='manage'){let mine=db.services.filter(s=>s.owner===user.id);html=`<h1>Servicios y disponibilidad</h1><div class="grid"><div class="card"><h2>Publicar servicio</h2><form id="serviceform">${field('name','Nombre del servicio')}${select('category','Categoría',cats.map(c=>opt(c,c)).join(''))}${field('price','Precio COP','number','min="1" step="1"')}${field('zone','Zona de atención')}${field('description','Descripción')}<button>Publicar servicio</button></form></div><div class="card"><h2>Ofrecer horario</h2><p>Un cupo por proveedor, fecha y hora. Duración: 60 minutos.</p><form id="slotform">${select('service','Servicio',mine.map(s=>opt(s.id,s.name)).join(''))}${field('date','Fecha','date',`min="${new Date().toLocaleDateString('en-CA')}"`)}${field('time','Hora de inicio','time','step="3600"')}<button>Agregar horario</button></form><h3>Horarios publicados</h3>${db.slots.filter(t=>mine.some(s=>s.id===t.service)).map(t=>`<p>${esc(mine.find(s=>s.id===t.service).name)}<br><small>${esc(t.date)} ${esc(t.time)} · ${busy(t.id)?'Ocupado':'Disponible'}</small></p>`).join('')||'<p>Publica horarios para recibir reservas.</p>'}</div></div>`}
else if(page==='bookings'){let rows=db.bookings.filter(b=>user.role==='propietario'?b.owner===user.id:db.services.find(s=>s.id===b.service)?.owner===user.id);html=`<h1>${user.role==='proveedor'?'Solicitudes recibidas':'Mis reservas'}</h1>${rows.map(b=>{let s=db.services.find(s=>s.id===b.service),t=db.slots.find(t=>t.id===b.slot),p=db.pets.find(p=>p.id===b.pet);return `<article class="card"><div class="row"><h2>${esc(s.name)}</h2><span class="badge">${esc(b.state)}</span></div><p>${esc(p.name)} · ${esc(t.date)} a las ${esc(t.time)} · ${money(b.price)}</p><small>Solicitud ${esc(b.id)}</small><p class="row">${user.role==='proveedor'&&b.state==='Pendiente'?`<button onclick="change('${b.id}','Confirmada')">Confirmar</button><button class="secondary" onclick="change('${b.id}','Rechazada')">Rechazar</button>`:''}${user.role==='propietario'&&['Pendiente','Confirmada'].includes(b.state)?`<button class="secondary" onclick="change('${b.id}','Cancelada')">Cancelar reserva</button>`:''}</p></article>`}).join('')||'<div class="empty">Todavía no tienes solicitudes.</div>'}`}
document.querySelector('#app').innerHTML=nav+html;bind();}
function busy(id){return db.bookings.some(b=>b.slot===id&&['Pendiente','Confirmada'].includes(b.state))}
function future(date,time){return new Date(date+'T'+time)>new Date()}
function reserve(id){if(!user){go('login');return tell('Ingresa como propietario para reservar.')}if(user.role!=='propietario')return tell('Las reservas se realizan con una cuenta de propietario.');let pets=db.pets.filter(p=>p.owner===user.id),slots=db.slots.filter(t=>t.service===id&&!busy(t.id)&&future(t.date,t.time));document.querySelector('#app').innerHTML=`<nav><button class="secondary" onclick="go('catalog')">Volver al catálogo</button></nav><h1>Reserva tu servicio</h1><div class="card"><h2>${esc(db.services.find(s=>s.id===id).name)}</h2>${pets.length&&slots.length?`<form id="reserveform">${select('pet','Mascota',pets.map(p=>opt(p.id,p.name)).join(''))}${select('slot','Horario disponible',slots.map(t=>opt(t.id,t.date+' · '+t.time)).join(''))}<button>Enviar solicitud</button></form>`:`<p>${!pets.length?'Primero registra una mascota en Mis mascotas.':'No hay horarios disponibles. El proveedor debe publicarlos.'}</p>`}</div>`;document.querySelector('#reserveform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);db=JSON.parse(localStorage.getItem(KEY));let t=db.slots.find(t=>t.id===f.get('slot'));if(!t||busy(t.id)||!future(t.date,t.time))return tell('Este horario ya no está disponible. Vuelve a consultar.');db.bookings.push({id:uid(),owner:user.id,pet:f.get('pet'),service:id,slot:t.id,state:'Pendiente',price:db.services.find(s=>s.id===id).price});save();go('bookings');tell('Solicitud creada. El horario quedó apartado.');});}
function change(id,state){let b=db.bookings.find(b=>b.id===id);if(!b)return;let owner=db.services.find(s=>s.id===b.service).owner;let allowed=(user.role==='proveedor'&&owner===user.id&&b.state==='Pendiente'&&['Confirmada','Rechazada'].includes(state))||(b.owner===user.id&&['Pendiente','Confirmada'].includes(b.state)&&state==='Cancelada');if(!allowed)return tell('Cambio de estado no permitido.');b.state=state;save();render();tell('Estado actualizado: '+state)}
function bind(){document.querySelector('#auth')?.addEventListener('submit',e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.email=f.email.trim().toLowerCase();if(page==='register'){if(!f.name.trim())return tell('Escribe un nombre.');if(db.users.some(u=>u.email===f.email))return tell('Este correo ya está registrado.');user={...f,name:f.name.trim(),id:uid()};db.users.push(user);save()}else{user=db.users.find(u=>u.email===f.email&&u.password===f.password);if(!user)return tell('Correo o contraseña incorrectos.')}go('catalog')});document.querySelector('#petform')?.addEventListener('submit',e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!f.name.trim())return tell('Escribe un nombre válido.');db.pets.push({...f,name:f.name.trim(),owner:user.id,id:uid()});save();render();tell('Mascota registrada.');});document.querySelector('#serviceform')?.addEventListener('submit',e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(['name','zone','description'].some(k=>!f[k].trim())||+f.price<=0)return tell('Completa los datos válidos.');db.services.push({...f,price:+f.price,owner:user.id,id:uid()});save();render();tell('Servicio publicado.');});document.querySelector('#slotform')?.addEventListener('submit',e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!f.service||!future(f.date,f.time))return tell('Elige un servicio y un horario futuro.');let owner=user.id,start=new Date(f.date+'T'+f.time).getTime();if(db.slots.some(t=>db.services.find(s=>s.id===t.service).owner===owner&&Math.abs(new Date(t.date+'T'+t.time).getTime()-start)<3600000))return tell('El proveedor ya tiene un horario que se cruza con este.');db.slots.push({...f,id:uid()});save();render();tell('Horario publicado.');});}render();
</script></html>
